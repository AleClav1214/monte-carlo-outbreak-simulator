[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outbreak-simulator"
version = "0.1.0"
description = "Monte Carlo infectious disease outbreak simulator: transmission risk, uncertainty quantification, intervention evaluation, and transmission reconstruction for closed-setting outbreaks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Monte Carlo Outbreak Simulator Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
transmission-inference-r = [
    # Optional: only needed to use the real TransPhylo (R) interface in
    # transmission_inference/transphylo_interface.py with actual genomic
    # data. Not required for the epidemiological (non-genomic) alternative.
    "rpy2>=3.5",
]

[project.urls]
Repository = "https://github.com/example-org/monte-carlo-outbreak-simulator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outbreak_simulator = ["data/parameters/*.yaml", "data/scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Pathogen parameter evidence table
# ===================================
#
# METHODOLOGY STATEMENT (read this before trusting any number below):
#
# This file was populated via targeted web searches against primary literature,
# systematic reviews, and public-health-agency guidance (CDC, WHO, UKHSA), run
# on 2026-07-20. It is NOT a PRISMA-compliant systematic review: no multi-database
# search (PubMed + Embase + Cochrane + medRxiv, deduplicated, two-stage screened)
# was performed, because that is a multi-week undertaking for a human team and
# cannot be honestly claimed to have happened here. What *was* done: for every
# required core parameter (r0, incubation_period, infectious_period, k_dispersion,
# secondary_attack_rate) for every pathogen, at least one real, retrievable,
# named source was located and read. Where multiple sources disagreed, the
# disagreement is recorded in `notes`, not papered over.
#
# evidence_quality is the field to check before trusting a number for anything
# consequential:
#   meta_analysis     -> pooled systematic review; treat as reasonably solid
#   multi_study       -> >=2 independent primary studies informally triangulated
#   single_study      -> one primary study or outbreak report; could be an outlier
#   expert_consensus  -> stable textbook/agency figure, no single pinpoint citation needed
#   modeled_estimate   -> inferred by fitting a model to case data, not measured directly
#   low_confidence     -> sparse/conflicting evidence; DO NOT treat as authoritative,
#                         re-derive from fresh literature before using for real decisions
#
# All parameters are editable in place. This is meant to be re-run and refreshed
# (see docs/reproducibility.md) rather than hardcoded numbers anywhere in the
# Python source.

sars_cov_2:
  pathogen_id: sars_cov_2
  display_name: "SARS-CoV-2 (ancestral / wild-type strain, 2020 baseline)"
  pathogen_class: "respiratory virus (airborne + droplet transmission)"
  last_reviewed: "2026-07-20"
  review_method: "Targeted literature search (web search + primary source retrieval), not a systematic review. See file header."
  parameters:
    r0:
      name: r0
      display_name: "Basic reproduction number (R0)"
      distribution: gamma
      point_estimate: 2.66
      low: 2.41
      high: 2.94
      ci_level: 0.95
      unit: dimensionless
      source: "Alimohamadi et al. 2020, meta-analysis of early R0 estimates (pooled R0=2.66, 95% CI 2.41-2.94)"
      source_url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9517346/"
      evidence_quality: meta_analysis
      justification: >
        Pooled estimate across many early-pandemic studies; used as the community-transmission
        baseline that scenario-specific contact_rate_multiplier values (see scenarios.yaml)
        scale up from. The same meta-analysis notes very high heterogeneity between studies
        (small-study effects, method-dependence) -- treat the interval as indicative, not exact.
      notes: >
        Variant- and context-dependent: later variants (Delta, Omicron) had substantially higher
        transmissibility; superspreading-driven early growth-phase analyses have estimated R0
        as high as 4.7-11.4 in some settings (Sneppen et al. 2021, PMC7540800) once superspreader
        dynamics are accounted for explicitly. This project treats such elevated values as
        *scenario-level effective R*, not baseline R0 -- see the contact_rate_multiplier field
        on each SARS-CoV-2 scenario.
    incubation_period:
      name: incubation_period
      display_name: "Incubation period"
      distribution: lognormal
      point_estimate: 5.8
      low: 5.01
      high: 6.69
      ci_level: 0.95
      unit: days
      source: "Meta-analytic lognormal incubation period (mean 5.8 days, meanlog=1.63, sdlog=0.50), as used in McAloon et al. 2020 and reproduced in Hart et al. medRxiv 2020.05.08.20094870"
      source_url: "https://www.medrxiv.org/content/10.1101/2020.05.08.20094870.full.pdf"
      evidence_quality: meta_analysis
      justification: >
        Lognormal is the distribution family used by essentially all major incubation-period
        meta-analyses for COVID-19 (right-skewed, long tail consistent with rare long
        incubations). meanlog/sdlog values are reported directly by source, avoiding
        re-derivation error.
      notes: >
        Multiple independent meta-analyses converge in the 5.1-6.6 day range for the ancestral
        strain (Elias et al. 2021: 6.4 days [2.3-17.6]; Wu et al. 2022 JAMA Netw Open: 6.57 days
        pooled across 141 studies). Omicron incubation is substantially shorter
        (pooled ~3.4-3.5 days, Wu et al. 2022; Manica et al. 2023 BMC Medicine). Use the
        ancestral-strain value as default; swap in a variant-specific estimate for
        contemporary-outbreak scenarios.
    infectious_period:
      name: infectious_period
      display_name: "Infectious period (duration of transmission risk)"
      distribution: gamma
      point_estimate: 8.0
      low: 5.0
      high: 10.0
      ci_level: 0.95
      unit: days
      source: "Synthesized from generation-interval literature (He et al. 2020 Nat Med; Ganyani et al. 2020 Euro Surveill) and public health isolation-period guidance"
      evidence_quality: expert_consensus
      justification: >
        No single study reports "infectious period" as a directly measured quantity comparable
        to incubation period; it is reconstructed from viral-shedding and generation-interval
        studies. Gamma distribution matches convention used for generation intervals in the
        cited sources.
      notes: >
        LOWER-CONFIDENCE PARAMETER: distinguish from generation interval (time between
        successive infections in a chain, commonly cited ~5.2 days for the ancestral strain
        per Ganyani et al.), which is a related but distinct quantity used directly in
        transmission-inference calculations (see transmission_inference module). The 8-day
        figure here represents the outer bound of meaningful transmission risk (pre-symptomatic
        window + ~5-8 days post-onset for mild cases); actual per-day infectiousness is
        front-loaded near symptom onset, not uniform across this window -- the branching
        process model treats this as a generation-interval-driven discrete-generation process
        rather than a continuous infectious window, which sidesteps needing a precise
        "period" cutoff (see models/branching_process.py).
    k_dispersion:
      name: k_dispersion
      display_name: "Negative-binomial dispersion parameter (k)"
      distribution: lognormal
      point_estimate: 0.15
      low: 0.04
      high: 0.60
      ci_level: 0.95
      unit: dimensionless
      source: "Endo et al. 2020 Wellcome Open Research (k~0.1); Adam et al. 2020 Nat Med, Hong Kong (k=0.10, 95% CI 0.05-0.20); systematic review Ratovoson et al. 2023 BMC Public Health (28 studies, mean k range 0.04-2.97, 93% of studies k<1)"
      source_url: "https://www.nature.com/articles/s41591-020-1092-0"
      evidence_quality: meta_analysis
      justification: >
        Lognormal chosen because k estimates in the literature span roughly an order of
        magnitude and are typically summarized/compared on a log scale. Central estimate
        anchored to the two most-cited primary estimates (Endo et al., Adam et al.); the
        [0.04, 0.60] interval reflects the spread found across the 28-study systematic review
        rather than any single study's narrower CI, since context (setting, time period,
        level of concurrent control measures) clearly shifts k substantially.
      justification_detail: "See notes for setting-specific k estimates (0.014-0.72 across settings per the same review)."
      notes: >
        This is THE key superspreading parameter: k=0.1 implies roughly the "20% of cases
        cause 80% of transmission" rule of thumb. Setting-specific estimates from the same
        systematic review ranged 0.014-0.72; New Zealand genomic-cluster-based estimate was
        notably higher (k=0.63, Tran-Kiem & Bedford), attributed to stronger contact-tracing-era
        suppression reducing superspreading opportunity. Treat k as context-dependent, not a
        pathogen constant -- scenario-level overrides are supported (see scenarios.yaml).
    secondary_attack_rate:
      name: secondary_attack_rate
      display_name: "Household secondary attack rate"
      distribution: beta
      point_estimate: 0.19
      low: 0.05
      high: 0.30
      ci_level: 0.95
      unit: probability
      source: "Madewell et al. 2020/2022 JAMA Netw Open household-transmission meta-analyses (pooled ~16.6%); cross-checked against an independent compendium of 10+ contact-tracing studies (Chin et al., arXiv:2006.01283) reporting household SAR in the 3-30% range depending on study and period"
      source_url: "https://arxiv.org/pdf/2006.01283"
      evidence_quality: meta_analysis
      justification: >
        Beta distribution is the standard choice for a bounded [0,1] probability; parameters
        implied by the point estimate and CI width via method-of-moments (see
        models/distributions.py:beta_from_mean_ci).
      notes: >
        Ancestral/Delta-era estimate. Household SAR increased substantially for Omicron
        (~35% per cross-pathogen benchmarking sources) due to immune escape, and dropped for
        SARS-CoV-1 (~6%). This project's default scenarios use the ancestral-strain value for
        consistency with the 2020 case studies (Skagit choir, military basic training) used
        for external validation.
    generation_interval:
      name: generation_interval
      display_name: "Generation interval (time between successive infections)"
      distribution: gamma
      point_estimate: 5.2
      low: 3.95
      high: 6.4
      ci_level: 0.95
      unit: days
      source: "Ganyani et al. 2020 Euro Surveill (Singapore cluster: 5.20 days; Tianjin cluster: 3.95 days, gamma-distributed)"
      evidence_quality: multi_study
      justification: >
        Gamma is the distribution family used directly by the source studies for generation
        interval; used here to convert branching-process generations into calendar time for
        epidemic-curve visualization, and as the serial-interval proxy in
        transmission_inference/epi_reconstruction.py.
      notes: "Two independent cluster studies gave meaningfully different point estimates (3.95 vs 5.20 days), reflecting real between-context variation, not just sampling noise."

mpox:
  pathogen_id: mpox
  display_name: "Mpox (2022-2024 outbreak clade IIb, human-to-human transmission)"
  pathogen_class: "orthopoxvirus (close/skin contact, respiratory droplet, fomite)"
  last_reviewed: "2026-07-20"
  review_method: "Targeted literature search (web search + primary source retrieval), not a systematic review. See sars_cov_2 entry header for full methodology statement."
  parameters:
    r0:
      name: r0
      display_name: "Basic reproduction number (R0)"
      distribution: gamma
      point_estimate: 2.2
      low: 1.37
      high: 3.68
      ci_level: 0.95
      unit: dimensionless
      source: "Multi-country 2022 estimates: UK 2.32 (deep-learning approach), Berlin 2.13 (95% PrI 1.19-3.13), England structured model 1.41-2.17 (Ward et al. 2023 Lancet Infect Dis), country range 1.37 (Canada) to 3.68 (Germany) (Ponce et al. 2024 J R Soc Interface)"
      source_url: "https://www.thelancet.com/journals/laninf/article/PIIS1473-3099(23)00451-6/fulltext"
      evidence_quality: multi_study
      justification: >
        No single pooled meta-analytic R0 exists for the 2022-2024 outbreak; point estimate
        is the rough center of mass across ~6 independent country/method estimates found.
        Wide interval deliberately preserves the real between-country heterogeneity (driven by
        differing sexual-network structure and intervention timing) rather than
        overstating precision.
      notes: >
        This R0 describes population-level spread within the affected sexual network during
        the 2022 outbreak, NOT general-population respiratory R0 (which is much lower -- mpox
        is comparatively inefficient at close-contact/respiratory spread outside of prolonged
        skin contact). Scenario-level parameters distinguish sexual-contact from
        non-sexual/household spread explicitly (see sexual_contact_secondary_attack_rate below).
    incubation_period:
      name: incubation_period
      display_name: "Incubation period"
      distribution: lognormal
      point_estimate: 8.0
      low: 6.0
      high: 13.0
      ci_level: 0.95
      unit: days
      source: "CDC Center for Forecasting and Outbreak Analytics household-transmission model (mean 8 days); deep-learning outbreak-parameter study (9-10 days); WHO mpox guidance (6-13 days, up to 21)"
      source_url: "https://archive.cdc.gov/www_cdc_gov/forecast-outbreak-analytics/about/modeling-forecasting/mpox-transmission.html"
      evidence_quality: multi_study
      justification: >
        Lognormal for consistency with the general convention for incubation periods
        (right-skewed). Point estimate and interval bridge the CDC modeling assumption (8 days)
        and the somewhat higher deep-learning estimate (9-10 days), with the WHO-cited upper
        tail (13 days for 95% of cases; up to 21 days maximum) as the high bound.
      notes: null
    infectious_period:
      name: infectious_period
      display_name: "Infectious period (symptomatic through lesion crusting)"
      distribution: gamma
      point_estimate: 18.0
      low: 14.0
      high: 27.0
      ci_level: 0.95
      unit: days
      source: "CDC household-transmission model (mean 27 days); WHO/CDC clinical guidance (infectious from prodrome until all lesions have crusted, typically 2-4 weeks)"
      evidence_quality: low_confidence
      justification: >
        Genuinely ambiguous parameter: some sources describe a short acute febrile-prodrome
        infectious window (~4-5 days) while others (and formal isolation guidance) treat the
        infectious period as lasting until full lesion crusting, i.e. 2-4 weeks. This project
        uses the longer, precautionary-isolation-guidance-consistent value because it is the
        more consequential one for outbreak-size projections; a shorter value would be
        optimistic and is flagged here as an important sensitivity-analysis target.
      notes: >
        FLAGGED FOR SENSITIVITY ANALYSIS: outbreak size projections are likely sensitive to
        this parameter given the wide literature range. Run sensitivity/one_way.py on this
        parameter before drawing conclusions from any mpox scenario.
    k_dispersion:
      name: k_dispersion
      display_name: "Negative-binomial dispersion parameter (k)"
      distribution: lognormal
      point_estimate: 0.5
      low: 0.1
      high: 1.5
      ci_level: 0.95
      unit: dimensionless
      source: "No consensus estimate located in literature search (see Alshahrani et al. 2025 PMC12056212: 'no consensus on the heterogeneity of Mpox transmission for the 2022-2024 outbreaks')"
      evidence_quality: low_confidence
      justification: >
        PLACEHOLDER ASSUMPTION, explicitly flagged. Set to a moderate-overdispersion value
        (higher/less extreme than SARS-CoV-2's k~0.1) reasoning by analogy from the
        sexual-network-concentrated transmission pattern (which typically implies some
        heterogeneity, since a minority of highly-connected individuals in the network drive
        disproportionate spread) without a directly measured k. DO NOT treat this as a
        literature-derived estimate; update as soon as a primary k-estimation study for mpox
        becomes available.
      notes: "This is the single weakest-evidence parameter in the mpox parameter set."
    secondary_attack_rate:
      name: secondary_attack_rate
      display_name: "Household (non-sexual close-contact) secondary attack rate"
      distribution: beta
      point_estimate: 0.08
      low: 0.0
      high: 0.20
      ci_level: 0.95
      unit: probability
      source: "Systematic review of endemic-country household data (pooled 8%, range 0-11%, Guagliardo et al., cited in CDC MMWR 72(50)); UK 2022 household study (4%, 60/1526, Ash et al. 2024); WHO 2026 situation report (approx. 20% for clade Ib household contacts)"
      source_url: "https://www.cdc.gov/mmwr/volumes/72/wr/mm7250a3.htm"
      evidence_quality: multi_study
      justification: >
        Beta distribution, standard for bounded probability. Point estimate anchored to the
        systematic-review pooled figure (8%); interval widened to include both the lower UK
        clade-IIb estimate (4%) and the higher WHO-reported clade-Ib figure (~20%), since clade
        and setting materially change this number.
      notes: >
        This parameter describes NON-SEXUAL household contact only. See
        sexual_contact_secondary_attack_rate for the very different sexual-contact figure
        (~75%), which is the operative parameter for the gathering-associated scenario.
    sexual_contact_secondary_attack_rate:
      name: sexual_contact_secondary_attack_rate
      display_name: "Secondary attack rate among sexual contacts (gathering-associated context)"
      distribution: beta
      point_estimate: 0.75
      low: 0.60
      high: 0.85
      ci_level: 0.95
      unit: probability
      source: "WHO Multi-country External Situation Report (secondary attack rate among sexual contacts ~75%, vs ~20% for non-sexual household contacts)"
      evidence_quality: single_study
      justification: >
        Reported as a single point estimate (~75%) without a formal CI in the source WHO
        situation report; low/high bounds here are an analyst-assigned +/-15pp uncertainty band
        pending a primary study with a reported interval, and should be treated as
        approximate framing rather than a precise statistical CI.
      notes: "Directly informs the mpox_gathering scenario's within-event transmission risk."

influenza:
  pathogen_id: influenza
  display_name: "Seasonal influenza A/B"
  pathogen_class: "respiratory virus (droplet + airborne)"
  last_reviewed: "2026-07-20"
  review_method: "Targeted literature search (web search + primary source retrieval), not a systematic review. See sars_cov_2 entry header for full methodology statement."
  parameters:
    r0:
      name: r0
      display_name: "Basic reproduction number (R0)"
      distribution: gamma
      point_estimate: 1.3
      low: 0.9
      high: 2.1
      ci_level: 0.95
      unit: dimensionless
      source: "Biggerstaff et al. 2014 BMC Infect Dis systematic review of R estimates for seasonal, pandemic, and zoonotic influenza; commonly cited range 0.9-2.1 for seasonal strains"
      source_url: "https://pubmed.ncbi.nlm.nih.gov/25186370/"
      evidence_quality: meta_analysis
      justification: >
        Systematic review is the most authoritative available source for influenza R
        estimates across many outbreak settings and years.
      notes: >
        Pandemic strains are higher: 2009 H1N1 commonly estimated at 1.4-1.6 (some early
        estimates up to 2.9); the 1918 pandemic strain had a median R of 1.80 (IQR 1.47-2.27)
        per the same systematic review. Use a pandemic-strain override for pandemic scenarios.
    incubation_period:
      name: incubation_period
      display_name: "Incubation period"
      distribution: lognormal
      point_estimate: 2.0
      low: 1.0
      high: 4.0
      ci_level: 0.95
      unit: days
      source: "Standard public-health guidance (CDC, WHO); well-established, low between-study variance figure not requiring a single pinpoint citation"
      evidence_quality: expert_consensus
      justification: "Textbook-stable figure; lognormal for consistency with other respiratory-virus incubation periods in this project."
      notes: null
    infectious_period:
      name: infectious_period
      display_name: "Infectious period"
      distribution: gamma
      point_estimate: 5.0
      low: 3.0
      high: 7.0
      ci_level: 0.95
      unit: days
      source: "Standard public-health guidance: infectious from ~1 day before symptom onset to ~5-7 days after, longer in children/immunocompromised"
      evidence_quality: expert_consensus
      justification: "Textbook-stable figure."
      notes: null
    k_dispersion:
      name: k_dispersion
      display_name: "Negative-binomial dispersion parameter (k)"
      distribution: lognormal
      point_estimate: 1.0
      low: 0.6
      high: 2.0
      ci_level: 0.95
      unit: dimensionless
      source: "Comparative overdispersion estimate for 1918 pandemic influenza, k~1 (approximately homogeneous), contrasted against SARS/SARS-CoV-2/MERS values of 0.1-0.25 (cited in Lloyd-Smith framework summaries, e.g. Riskfrontiers 2025 synthesis of Lloyd-Smith et al. 2005 Nature)"
      source_url: "https://riskfrontiers.com/insights/how-overdispersion-drives-the-spread-of-the-sars-cov-2-pandemic/"
      evidence_quality: single_study
      justification: >
        Influenza is the standard textbook contrast case for "low overdispersion" transmission
        (relative to SARS-like coronaviruses), attributed to influenza's efficient, less
        contact-structure-dependent respiratory spread. Value used here reflects that
        qualitative consensus more than a precise, dedicated influenza-k estimation study.
      notes: "Secondary source relaying the Lloyd-Smith et al. 2005 comparative figure, not the primary paper directly -- flagged accordingly."
    secondary_attack_rate:
      name: secondary_attack_rate
      display_name: "Household secondary attack rate"
      distribution: beta
      point_estimate: 0.10
      low: 0.05
      high: 0.19
      ci_level: 0.95
      unit: probability
      source: "Multiple household-transmission studies: San Antonio H1N1 (4-13% by case definition), Navarra Spain H1N1pdm09 (14-19%), Ontario H1N1 (10.3-20.2%), WHO seasonal-flu benchmark (5-15%)"
      source_url: "https://wwwnc.cdc.gov/eid/article/16/4/09-1658_article"
      evidence_quality: multi_study
      justification: >
        Beta distribution for a bounded probability; point estimate and interval triangulated
        across four independent household-contact studies plus the WHO seasonal benchmark
        range, deliberately centered on the seasonal (non-pandemic) figure.
      notes: "Pandemic-strain household SAR runs meaningfully higher (up to ~33% per WHO H1N1 estimates) -- override for pandemic scenarios."
    serial_interval:
      name: serial_interval
      display_name: "Serial interval"
      distribution: gamma
      point_estimate: 3.0
      low: 2.6
      high: 4.0
      ci_level: 0.95
      unit: days
      source: "Household studies: Ontario H1N1 (median 3.0 days), Navarra H1N1pdm09 (mean 3.7 days, 95% CI 3.5-4.0)"
      evidence_quality: multi_study
      justification: "Gamma distribution, standard for serial-interval/generation-interval quantities; range spans the two cited study point estimates."
      notes: null

norovirus:
  pathogen_id: norovirus
  display_name: "Norovirus (GI/GII genogroups)"
  pathogen_class: "enteric virus (fecal-oral, fomite, and short-range aerosol from vomiting)"
  last_reviewed: "2026-07-20"
  review_method: "Targeted literature search (web search + primary source retrieval), not a systematic review. See sars_cov_2 entry header for full methodology statement."
  parameters:
    r0:
      name: r0
      display_name: "Basic reproduction number (R0), general community"
      distribution: gamma
      point_estimate: 2.1
      low: 1.1
      high: 3.7
      ci_level: 0.95
      unit: dimensionless
      source: "General epidemiological reference range for community norovirus transmission; no single primary R0-estimation study located in this search pass covering the general-community baseline directly"
      evidence_quality: low_confidence
      justification: >
        HONESTLY FLAGGED WEAKER PARAMETER: this project could not locate a primary-literature
        community-baseline R0 estimation study for norovirus in the time available (searches
        instead surfaced strong data on closed-setting effective R, incubation, and outbreak
        attack rates -- see closed_setting_effective_r and secondary_attack_rate below, which
        rest on firmer evidence). Point estimate/range reflects commonly cited textbook figures;
        treat with caution for any use where the general-community baseline (as opposed to a
        specific closed-setting outbreak) matters.
      notes: "Re-derive from primary literature (e.g. a dedicated norovirus transmission-modeling review) before using this figure for anything consequential."
    incubation_period:
      name: incubation_period
      display_name: "Incubation period"
      distribution: lognormal
      point_estimate: 1.37
      low: 0.5
      high: 2.0
      ci_level: 0.95
      unit: days
      source: "Chan et al. meta-analysis of 1022 outbreaks (mean 32.8h [95% CI 30.9-34.6h], median 33.5h [95% CI 32.0-34.0h]); consistent with the classic Kaplan et al. 12-48h range"
      source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8845055/"
      evidence_quality: meta_analysis
      justification: "Strongest-evidence parameter in this pathogen's set: large meta-analysis (n=1022 outbreaks) with tight confidence intervals. Values converted from hours to days."
      notes: null
    infectious_period:
      name: infectious_period
      display_name: "Symptomatic illness duration"
      distribution: gamma
      point_estimate: 1.84
      low: 0.5
      high: 6.0
      ci_level: 0.95
      unit: days
      source: "Chan et al. meta-analysis (mean symptomatic period 44.2h [95% CI 38.9-50.7h]); illness course generally cited as 1-5 days, occasionally 4-6 days"
      evidence_quality: meta_analysis
      justification: "Same meta-analysis as incubation period, for internal consistency; converted from hours to days."
      notes: >
        Viral SHEDDING continues far longer than symptomatic illness -- one cited study found
        shedding starting ~36h post-infection and continuing ~26 days on average (range 11-54
        days). This project's infectious_period represents the high-transmission-risk
        symptomatic window used for the branching-process model; the much longer low-level
        shedding tail is a known simplification (see docs/validation_plan.md limitations).
    k_dispersion:
      name: k_dispersion
      display_name: "Negative-binomial dispersion parameter (k)"
      distribution: lognormal
      point_estimate: 0.5
      low: 0.15
      high: 1.5
      ci_level: 0.95
      unit: dimensionless
      source: "No dedicated norovirus k-estimation study located in this search pass"
      evidence_quality: low_confidence
      justification: >
        PLACEHOLDER ASSUMPTION. Norovirus outbreaks are frequently driven by point-source
        contamination events (a single contaminated food item or surface) that can produce
        apparent clustering resembling superspreading without true person-to-person
        transmission heterogeneity -- this confound makes borrowing a k estimate from
        person-to-person-only pathogens inappropriate, but no norovirus-specific study was
        found to use instead. Treat this value as a rough placeholder only.
      notes: null
    secondary_attack_rate:
      name: secondary_attack_rate
      display_name: "Outbreak attack rate in closed settings (school/camp proxy for household SAR)"
      distribution: beta
      point_estimate: 0.30
      low: 0.21
      high: 0.42
      ci_level: 0.95
      unit: probability
      source: "Torner et al. 2022 (Catalonia schools/summer camps, 2017-2019): overall attack rate 21.27% in schools, 33.42% in summer camps; broader outbreak-review data (Matthews et al.) report mean per-outbreak attack rate 41.65%"
      source_url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9241749/"
      evidence_quality: multi_study
      justification: >
        NOTE ON DEFINITION: this is a total-outbreak attack rate (cases / total exposed
        population in a closed setting), not a classic dyadic household secondary attack rate
        -- no precise per-contact household SAR study was located in this search pass. Used
        here as the best available proxy since the modeled scenarios are closed-setting
        outbreaks, not household transmission chains.
      notes: "closed_setting_effective_r below provides a complementary, independently-sourced cross-check on transmission intensity in exactly this kind of setting."
    closed_setting_effective_r:
      name: closed_setting_effective_r
      display_name: "Effective reproduction number, person-to-person route, school outbreak setting"
      distribution: gamma
      point_estimate: 8.92
      low: 4.0
      high: 14.0
      ci_level: 0.95
      unit: dimensionless
      source: "Xu et al. 2023, Jiangsu Province school outbreaks: effective reproduction number for human-to-human transmission route estimated at 8.92 (water/food-to-human route separately estimated at 2.19)"
      source_url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10444007/"
      evidence_quality: single_study
      justification: >
        Single-study estimate, but directly relevant: this is exactly the "closed indoor
        setting, sustained person-to-person spread" scenario this project models for
        norovirus, unlike the more general community R0 above. Low/high bounds are an
        analyst-assigned uncertainty band (no CI reported in source) pending replication.
      notes: "Striking illustration of how much higher effective R can run in closed settings relative to general community R0 -- directly motivates this project's scenario-level contact_rate_multiplier design."

measles:
  pathogen_id: measles
  display_name: "Measles (rubeola)"
  pathogen_class: "respiratory virus (airborne, highly efficient)"
  last_reviewed: "2026-07-20"
  review_method: "Targeted literature search (web search + primary source retrieval), not a systematic review. See sars_cov_2 entry header for full methodology statement."
  parameters:
    r0:
      name: r0
      display_name: "Basic reproduction number (R0)"
      distribution: gamma
      point_estimate: 15.0
      low: 12.0
      high: 18.0
      ci_level: 0.95
      unit: dimensionless
      source: "Consistently cited across independent sources: CDC EID (Voigt et al. 2024, PMC11346981), University of Michigan School of Public Health explainer, standard epidemiology textbooks"
      source_url: "https://wwwnc.cdc.gov/eid/article/30/9/24-0150_article"
      evidence_quality: expert_consensus
      justification: >
        One of the most robust, widely-replicated figures in infectious disease epidemiology;
        multiple independent sources across different decades converge tightly on 12-18.
      notes: "Among the highest R0 values of any known human pathogen; the basis for the ~95% vaccination coverage threshold commonly cited for measles herd immunity."
    incubation_period:
      name: incubation_period
      display_name: "Incubation period (exposure to prodromal symptom onset)"
      distribution: lognormal
      point_estimate: 10.0
      low: 8.0
      high: 12.0
      ci_level: 0.95
      unit: days
      source: "Louisiana Dept. of Health epidemiology manual / CDC Pink Book: incubation 8-12 days to prodrome onset, ~14 days average to rash appearance"
      source_url: "https://ldh.la.gov/assets/oph/Center-PHCH/Center-CH/infectious-epi/EpiManual/MeaslesManual.pdf"
      evidence_quality: expert_consensus
      justification: "Stable, widely-replicated public-health-agency figure."
      notes: >
        IMPORTANT MODELING DETAIL: measles cases are infectious from ~4 days BEFORE rash
        onset, i.e. before the classic diagnostic sign appears -- this project's
        infectious_period window is centered on this pre-rash infectious period, not on
        rash-to-recovery, since that is when most transmission actually happens.
    infectious_period:
      name: infectious_period
      display_name: "Infectious period (relative to rash onset)"
      distribution: gamma
      point_estimate: 8.0
      low: 6.0
      high: 9.0
      ci_level: 0.95
      unit: days
      source: "Standard public-health guidance: infectious ~4 days before through ~4 days after rash onset"
      evidence_quality: expert_consensus
      justification: "Textbook-stable figure (CDC Pink Book, WHO)."
      notes: null
    k_dispersion:
      name: k_dispersion
      display_name: "Negative-binomial dispersion parameter (k)"
      distribution: lognormal
      point_estimate: 1.0
      low: 0.3
      high: 2.0
      ci_level: 0.95
      unit: dimensionless
      source: "No dedicated measles k-estimation study located in this search pass"
      evidence_quality: low_confidence
      justification: >
        PLACEHOLDER ASSUMPTION based on general epidemiological reasoning rather than a
        literature point estimate: pathogens with very high, airborne-efficient baseline R0
        that can infect most susceptibles in a room tend to show somewhat less *relative*
        overdispersion than close-contact-dependent pathogens, because the transmission
        opportunity is less bottlenecked by individual behavioral heterogeneity. This is
        an analyst judgment call, not a citation -- flagged accordingly. Documented
        superspreading events do occur (e.g. single cases in clinics/schools infecting dozens
        of susceptible contacts), so this should not be read as "measles has no
        superspreading."
      notes: "Highest-priority parameter to replace with a real literature estimate if this project is extended."
    secondary_attack_rate:
      name: secondary_attack_rate
      display_name: "Household secondary attack rate, susceptible (unvaccinated) contacts"
      distribution: beta
      point_estimate: 0.85
      low: 0.75
      high: 0.90
      ci_level: 0.95
      unit: probability
      source: "Cross-pathogen SAR benchmarking (measles ~75% commonly cited as a conservative figure; CDC/WHO outbreak-investigation guidance cites up to ~90% among susceptible household contacts)"
      evidence_quality: expert_consensus
      justification: "Beta distribution for bounded probability; among the most consistently-cited SAR figures across sources given how extensively measles household transmission has been studied historically."
      notes: null
    vaccine_efficacy:
      name: vaccine_efficacy
      display_name: "Single-dose MMR vaccine efficacy (historical outbreak-derived estimate)"
      distribution: beta
      point_estimate: 0.973
      low: 0.801
      high: 0.999
      ci_level: 0.95
      unit: probability
      source: "Cherry et al., secondary attack rates during the 1974 Cheyenne/Standing Rock Sioux Reservation measles epidemic (vaccine efficacy 97.3%, 95% CI 80.1-99.9%)"
      evidence_quality: single_study
      justification: >
        Directly usable as the default vaccination-intervention efficacy parameter for
        measles scenarios; single historical study, but consistent with the broadly-cited
        modern two-dose MMR efficacy figure (~97%) from routine immunization program data.
      notes: "Two-dose modern MMR efficacy is generally cited even higher (~97-99%); this single-dose 1970s figure is retained as a conservative default."

varicella:
  pathogen_id: varicella
  display_name: "Varicella (chickenpox, primary VZV infection)"
  pathogen_class: "respiratory virus (airborne) + direct vesicular contact"
  last_reviewed: "2026-07-20"
  review_method: "Targeted literature search (web search + primary source retrieval), not a systematic review. See sars_cov_2 entry header for full methodology statement."
  parameters:
    r0:
      name: r0
      display_name: "Basic reproduction number (R0)"
      distribution: gamma
      point_estimate: 10.0
      low: 7.0
      high: 12.0
      ci_level: 0.95
      unit: dimensionless
      source: "Commonly cited textbook range for varicella R0 (order of magnitude below measles, above influenza); no dedicated modern primary R0-estimation study located in this search pass"
      evidence_quality: low_confidence
      justification: >
        HONESTLY FLAGGED: unlike measles, no primary modern R0-estimation study for varicella
        was retrieved in this search pass. Value reflects standard epidemiological teaching
        (varicella as a highly transmissible but somewhat-less-efficient airborne spreader than
        measles) rather than a specific citable point estimate. Re-derive from a dedicated
        source (e.g. Anderson & May-style historical estimates) before using this figure for
        anything consequential.
      notes: null
    incubation_period:
      name: incubation_period
      display_name: "Incubation period"
      distribution: lognormal
      point_estimate: 15.0
      low: 10.0
      high: 21.0
      ci_level: 0.95
      unit: days
      source: "CDC Varicella Outbreak Control and Investigation Manual; CDC Pink Book; CDC Yellow Book 2024 -- all independently cite 14-16 days average, range 10-21 days"
      source_url: "https://archive.cdc.gov/www_cdc_gov/chickenpox/outbreaks/manual.html"
      evidence_quality: meta_analysis
      justification: "Extremely well-replicated figure across independent CDC reference documents spanning many years."
      notes: null
    infectious_period:
      name: infectious_period
      display_name: "Infectious period (relative to rash onset)"
      distribution: gamma
      point_estimate: 6.0
      low: 5.0
      high: 9.0
      ci_level: 0.95
      unit: days
      source: "CDC clinical guidance: infectious 1-2 days before rash onset through full lesion crusting, typically 4-7 days after rash onset in immunocompetent people"
      source_url: "https://www.cdc.gov/chickenpox/hcp/clinical-overview/index.html"
      evidence_quality: expert_consensus
      justification: "Textbook-stable figure, consistent across CDC reference documents."
      notes: null
    k_dispersion:
      name: k_dispersion
      display_name: "Negative-binomial dispersion parameter (k)"
      distribution: lognormal
      point_estimate: 1.0
      low: 0.3
      high: 2.0
      ci_level: 0.95
      unit: dimensionless
      source: "No dedicated varicella k-estimation study located in this search pass"
      evidence_quality: low_confidence
      justification: >
        PLACEHOLDER ASSUMPTION by analogy to measles (see measles.k_dispersion.justification
        for the same reasoning applied there). Not a literature-derived estimate.
      notes: "Highest-priority parameter to replace with a real literature estimate if this project is extended."
    secondary_attack_rate:
      name: secondary_attack_rate
      display_name: "Household secondary attack rate, susceptible contacts"
      distribution: beta
      point_estimate: 0.85
      low: 0.65
      high: 0.90
      ci_level: 0.95
      unit: probability
      source: "CDC Yellow Book 2024 (~85%, range 61-100%); Arvin 1996 / Ross 1962 (90%, as cited in Marin et al. varicella vaccine review); CDC Varicella Outbreak Manual (65-86%)"
      source_url: "https://wwwnc.cdc.gov/travel/yellowbook/2024/infections-diseases/varicella-chickenpox"
      evidence_quality: meta_analysis
      justification: "Beta distribution for bounded probability; three independent CDC/review sources converge tightly, giving high confidence in this figure specifically for household contacts."
      notes: >
        IMPORTANT COUNTEREXAMPLE TO 'closed settings always increase SAR': a military training
        centre outbreak investigation (Bhatta et al. 2022) found a much lower SAR of 21.43%
        among close contacts in that setting, plausibly reflecting partial population immunity
        (prior infection/vaccination) rather than lower intrinsic transmissibility. This is
        recorded here as a caution against assuming setting-level multipliers always push SAR
        upward -- population susceptibility matters at least as much.
